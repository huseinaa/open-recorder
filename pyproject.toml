[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-recorder"
dynamic = ["version"]
description = "A free screen + webcam recorder and editor for Windows: separate face and screen tracks, a simple timeline, and an AI that edits on your own Claude or ChatGPT subscription."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Husein Aboul Hasan" }]
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "mss>=9",
    "psutil>=5.9",
    "platformdirs>=3",
    "pywebview>=5.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Topic :: Multimedia :: Video :: Capture",
    "Environment :: Win32 (MS Windows)",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
ai = ["faster-whisper>=1.0"]

[project.urls]
Homepage = "https://github.com/huseinaa/open-recorder"

[project.scripts]
open-recorder = "open_recorder.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "open_recorder.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_recorder = ["assets/*.ico", "assets/*.svg", "assets/*.png", "editor/ui/img/*.svg", "editor/ui/*.html", "editor/ui/css/*.css", "editor/ui/js/*.js", "editor/ui/js/*/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
